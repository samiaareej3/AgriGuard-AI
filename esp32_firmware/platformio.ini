; AgriGuard ESP32-CAM firmware (AI-Thinker ESP32-CAM, OV2640)
; Build:  pio run          Flash: pio run -t upload     Monitor: pio device monitor
; Status: written against docs/DEVICE_API.md; NOT yet compiled or tested on hardware.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
